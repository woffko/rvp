    <symbol id="icon-right" viewBox="0 0 24 24">
      <path d="M9.5 7 L14.5 12 L9.5 17" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-top" viewBox="0 0 24 24">
      <path d="M6.5 6 H17.5 M7 16 L12 11 L17 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-bottom" viewBox="0 0 24 24">
      <path d="M6.5 18 H17.5 M7 8 L12 13 L17 8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
