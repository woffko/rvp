    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path fill="currentColor" fill-rule="evenodd"
            d="M17.8 8.85 L18.38 10.29 L20.64 10.32 L20.64 13.68 L18.38 13.71 L18.33 13.87 L17.72 15.3
               L19.3 16.92 L16.92 19.3 L15.3 17.72 L15.15 17.8 L13.71 18.38 L13.68 20.64 L10.32 20.64
               L10.29 18.38 L10.13 18.33 L8.7 17.72 L7.08 19.3 L4.7 16.92 L6.28 15.3 L6.2 15.15 L5.62 13.71
               L3.36 13.68 L3.36 10.32 L5.62 10.29 L5.67 10.13 L6.28 8.7 L4.7 7.08 L7.08 4.7 L8.7 6.28
               L8.85 6.2 L10.29 5.62 L10.32 3.36 L13.68 3.36 L13.71 5.62 L13.87 5.67 L15.3 6.28 L16.92 4.7
               L19.3 7.08 L17.72 8.7 Z
               M12 9 A3 3 0 1 0 12 15 A3 3 0 1 0 12 9 Z"/>
