    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M7 7 L17 17 M17 7 L7 17" fill="none" stroke="currentColor" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-aspect" viewBox="0 0 24 24">
      <path d="M4 9 V6.5 C4 5.7 4.7 5 5.5 5 H8 M16 5 H18.5 C19.3 5 20 5.7 20 6.5 V9 M20 15 V17.5 C20 18.3 19.3 19 18.5 19 H16 M8 19 H5.5 C4.7 19 4 18.3 4 17.5 V15"
            fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
