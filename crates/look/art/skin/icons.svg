    <symbol id="icon-shorter" viewBox="0 0 24 24">
      <path d="M12 3 V9.5 M9 6.5 L12 9.5 L15 6.5 M12 21 V14.5 M9 17.5 L12 14.5 L15 17.5 M6.5 12 H17.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-capture-folder" viewBox="0 0 24 24">
      <path d="M4 7.5 C4 6.7 4.7 6 5.5 6 H9.5 L11.5 8 H18.5 C19.3 8 20 8.7 20 9.5 V17 C20 17.8 19.3 18.5 18.5 18.5 H5.5 C4.7 18.5 4 17.8 4 17 Z"
            fill="none" stroke="currentColor" stroke-linejoin="round"/>
    </symbol>
  </defs>
  <rect width="312" height="120" fill="#1C1F23"/>
  <g color="#E8E5E0" stroke-width="2">
    <use href="#icon-play" x="4" y="4" width="24" height="24"/>
    <use href="#icon-pause" x="32" y="4" width="24" height="24"/>
    <use href="#icon-previous" x="60" y="4" width="24" height="24"/>
    <use href="#icon-next" x="88" y="4" width="24" height="24"/>
    <use href="#icon-stop" x="116" y="4" width="24" height="24"/>
    <use href="#icon-volume" x="144" y="4" width="24" height="24"/>
    <use href="#icon-mute" x="172" y="4" width="24" height="24"/>
    <use href="#icon-subtitles" x="200" y="4" width="24" height="24"/>
    <use href="#icon-playlist" x="228" y="4" width="24" height="24"/>
    <use href="#icon-audio" x="256" y="4" width="24" height="24"/>
    <use href="#icon-minimize" x="284" y="4" width="24" height="24"/>
    <use href="#icon-maximize" x="4" y="32" width="24" height="24"/>
