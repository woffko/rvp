    <symbol id="icon-taller" viewBox="0 0 24 24">
      <path d="M12 4 V20 M8.5 7.5 L12 4 L15.5 7.5 M8.5 16.5 L12 20 L15.5 16.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
