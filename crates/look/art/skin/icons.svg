    <symbol id="icon-font" viewBox="0 0 24 24">
      <path d="M6 18.5 L12 5 L18 18.5 M8.4 13.5 H15.6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
