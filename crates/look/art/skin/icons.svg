<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312 120" width="624" height="240">
  <title>RVP Default: icons</title>
  <!--
    Drawn for RVP on a 24-unit grid. Strokes take their width from the
    element that uses the icon (the skin builder sets it per sprite, 2 by
    default) and their colour from `color`, so one icon serves every
    button state. The grid below the definitions previews them all.
  -->
  <defs>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <path d="M8.5 5.5 L18.5 12 L8.5 18.5 Z" fill="currentColor" stroke="currentColor" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24">
      <rect x="6.5" y="5" width="4" height="14" rx="1.3" fill="currentColor"/>
      <rect x="13.5" y="5" width="4" height="14" rx="1.3" fill="currentColor"/>
    </symbol>
    <symbol id="icon-previous" viewBox="0 0 24 24">
      <path d="M18 6.5 L10.5 12 L18 17.5 Z" fill="currentColor" stroke="currentColor" stroke-linejoin="round"/>
      <path d="M6.5 6 V18" fill="none" stroke="currentColor" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-next" viewBox="0 0 24 24">
      <path d="M6 6.5 L13.5 12 L6 17.5 Z" fill="currentColor" stroke="currentColor" stroke-linejoin="round"/>
      <path d="M17.5 6 V18" fill="none" stroke="currentColor" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24">
      <rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/>
    </symbol>
    <symbol id="icon-volume" viewBox="0 0 24 24">
      <path d="M4 9.5 H7.5 L12 5.5 V18.5 L7.5 14.5 H4 Z" fill="currentColor" stroke="currentColor" stroke-linejoin="round"/>
      <path d="M15.5 9 C16.7 10.6 16.7 13.4 15.5 15 M18.3 6.5 C20.6 9.6 20.6 14.4 18.3 17.5" fill="none" stroke="currentColor" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-mute" viewBox="0 0 24 24">
      <path d="M4 9.5 H7.5 L12 5.5 V18.5 L7.5 14.5 H4 Z" fill="currentColor" stroke="currentColor" stroke-linejoin="round"/>
      <path d="M15.5 9.5 L20.5 14.5 M20.5 9.5 L15.5 14.5" fill="none" stroke="currentColor" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-subtitles" viewBox="0 0 24 24">
      <rect x="3.5" y="5.5" width="17" height="13" rx="2.5" fill="none" stroke="currentColor"/>
      <path d="M7 11 H12 M14.5 11 H17 M7 14.5 H9.5 M12 14.5 H17" fill="none" stroke="currentColor" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-playlist" viewBox="0 0 24 24">
      <path d="M4 6.5 H17 M4 11.5 H17 M4 16.5 H10.5" fill="none" stroke="currentColor" stroke-linecap="round"/>
      <path d="M14 14 L19.5 17.25 L14 20.5 Z" fill="currentColor" stroke="currentColor" stroke-linejoin="round" stroke-width="1"/>
    </symbol>
    <symbol id="icon-audio" viewBox="0 0 24 24">
      <path d="M4.5 10.5 V13.5 M8.25 8 V16 M12 5 V19 M15.75 8.5 V15.5 M19.5 10.5 V13.5" fill="none" stroke="currentColor" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-minimize" viewBox="0 0 24 24">
      <path d="M6.5 16.5 H17.5" fill="none" stroke="currentColor" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-maximize" viewBox="0 0 24 24">
      <rect x="6.5" y="6.5" width="11" height="11" rx="1.5" fill="none" stroke="currentColor"/>
    </symbol>
    <symbol id="icon-restore" viewBox="0 0 24 24">
