[package]
name = "rvp-shell"
description = "The RVP window: Qt Quick, the skin painter and the libmpv video item (milestone M2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rvp"
path = "src/main.rs"

[dependencies]
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
rvp-app = { path = "../crates/app" }
rvp-engine = { path = "../crates/engine" }
rvp-look = { path = "../crates/look" }
rvp-skin = { path = "../crates/skin" }
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# MPRIS and idle inhibit (M8).
rvp-platform = { path = "../crates/platform" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true
# Draws the icons, the logo images and the default skin from their sources.
rvp-look = { path = "../crates/look" }

# Not the workspace lints: cxx-qt's generated bridge code needs `unsafe`
# (owner decision 2026-10-10, AGENTS.md), so it is denied here instead of
# forbidden and allowed only on the bridge modules and FFI points.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
