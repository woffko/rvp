name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Disk space (Linux)
        # The hosted runner's preinstalled SDKs leave too little for the
        # workspace's debug build and tests (the link ran out of space).
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: libmpv and Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libgl-dev libegl-dev libxkbcommon-dev \
            libfontconfig1-dev libfreetype-dev
      - name: The synthetic DVD and Blu-ray with menus (Linux)
        # M16's navigation tests (shell/src/disc/tests.rs) play them
        # through libdvdnav and libbluray.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y dvdauthor ffmpeg libdvdnav4 libbluray2
          tools/test-clips/make-m16-dvd.sh "$RUNNER_TEMP/m16-dvd"
          python3 -I tools/test-clips/make-m16-bluray.py "$RUNNER_TEMP/m16-bd"
          echo "RVP_DVD_MENU=$RUNNER_TEMP/m16-dvd" >> "$GITHUB_ENV"
          echo "RVP_BD_MENU=$RUNNER_TEMP/m16-bd" >> "$GITHUB_ENV"
      - name: Lua 5.1 for the remote's signatures (Linux)
        # tests/remote.rs runs remote.lua's SHA-256, HMAC and signed
        # requests with it (Unified Remote's Lua is 5.1-style).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y lua5.1
          echo "RVP_LUA=$(command -v lua5.1)" >> "$GITHUB_ENV"
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          cache: true
      - name: Qt on the loader path (Linux)
        if: runner.os == 'Linux'
        run: echo "LD_LIBRARY_PATH=$QT_ROOT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: libmpv cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/libmpv/*.7z
          key: libmpv-shinchiro-20261010
      - name: libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/windows-libmpv.ps1
      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: tests
        # Every test binary runs, so one run shows every failure.
        run: cargo test --workspace --locked --no-fail-fast

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # M8: the packages as artifacts of this private repository (never
  # published). Linux on the oldest system they support, through the
  # Linux kit (its Qt and libmpv, cached); Windows natively, with NSIS.
  package-linux:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    env:
      RVP_KIT_DIR: ${{ github.workspace }}/../rvp-kit
    steps:
      - name: Disk space
        # The kit's SDK, libmpv, RVP's build and the packages need room.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - name: The kit's build packages
        run: |
          eval "$(sed -n '/^PACKAGES=/,/"$/p' tools/linux-kit/kit.sh)"
          sudo apt-get update
          sudo apt-get install -y $PACKAGES squashfs-tools
      - name: The kit's versions
        id: kit
        run: |
          echo "key=$(grep -E '^(QT_VERSION|MPV_COMMIT|MPV_BUILD|FFMPEG_COMMIT|LIBPLACEBO_COMMIT)=' tools/linux-kit/kit.sh | tr '\n' '-')" >> "$GITHUB_OUTPUT"
          echo "parts=$(grep -E '^(MVTOOLS_TAG|VS_TAG|VULKAN_HEADERS_TAG|GLSLANG_TAG|SHADERC_COMMIT)=' tools/linux-kit/kit.sh | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Qt and libmpv cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.RVP_KIT_DIR }}/qt
            ${{ env.RVP_KIT_DIR }}/mpv
          key: kit-ubuntu-22.04-${{ steps.kit.outputs.key }}
      - name: Qt and libmpv
        run: tools/linux-kit/kit.sh deps mpv
      # The packages carry whisper.cpp's engine (subtitles from audio) and
      # RVP's VapourSynth runtime with MVTools, RIFE and vs-mlrt (motion
      # smoothing): built once per change of their scripts or the kit's
      # versions, then cached (m8package fails without them).
      - name: The packages' parts cache
        id: parts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.RVP_KIT_DIR }}/mvtools/build/libmvtools.so
            ${{ env.RVP_KIT_DIR }}/mvtools/.kit-mvtools
            ${{ env.RVP_KIT_DIR }}/whisper/whisper-out
            ${{ env.RVP_KIT_DIR }}/vs-runtime
          key: parts-ubuntu-22.04-${{ steps.kit.outputs.parts }}${{ hashFiles('tools/whisper/build-linux.sh', 'tools/whisper/version.cmake', 'tools/vapoursynth/build-linux.sh', 'tools/vapoursynth/build-vstrt-linux.sh', 'tools/vapoursynth/*.patch', 'tools/linux-kit/sources.sh') }}
      - name: whisper.cpp, MVTools and RVP's VapourSynth runtime
        if: steps.parts.outputs.cache-hit != 'true'
        run: tools/linux-kit/kit.sh mvtools whisper vapoursynth
      - name: Packages
        run: |
          tools/linux-kit/kit.sh m8package
          # upload-artifact takes no path with "..".
          mkdir -p packages
          cp "$RVP_KIT_DIR"/logs/m8-packages/*.AppImage "$RVP_KIT_DIR"/logs/m8-packages/*.deb packages/
      - name: The packages on Ubuntu 26.10
        # M16's synthetic menu discs for the packaged disc libraries.
        run: |
          tools/test-clips/make-m16-dvd.sh discs/dvd
          python3 -I tools/test-clips/make-m16-bluray.py discs/bd
          docker run --rm -v "$PWD:/src:ro" ubuntu:26.10 \
            bash /src/tools/packaging/check-deb.sh /src/packages /src/testdata/media /src/discs
      - name: Logs of a failed step
        if: failure()
        run: tail -n 60 "$RVP_KIT_DIR"/logs/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: rvp-linux
          path: |
            packages/*.AppImage
            packages/*.deb
          retention-days: 14

  package-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          cache: true
      - name: libmpv cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/libmpv/*.7z
          key: libmpv-shinchiro-20261010
      - name: libmpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/windows-libmpv.ps1
      - name: NSIS cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nsis
          key: nsis-chocolatey-1
      - name: NSIS
        shell: pwsh
        run: |
          $cached = Join-Path $env:RUNNER_TEMP 'nsis\makensis.exe'
          if (-not (Test-Path $cached)) {
            # The runner image may lack NSIS, and Chocolatey's feed fails now
            # and then: retry, and keep a copy (NSIS runs from any folder)
            # for later runs, which then need no Chocolatey.
            $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            for ($attempt = 1; -not (Test-Path $nsis) -and $attempt -le 3; $attempt++) {
              choco install nsis -y --no-progress
              if (-not (Test-Path $nsis)) { Start-Sleep -Seconds 20 }
            }
            if (-not (Test-Path $nsis)) { throw "NSIS is not installed: $nsis" }
            Copy-Item -Recurse (Split-Path $nsis) (Join-Path $env:RUNNER_TEMP 'nsis')
          }
          "MAKENSIS=$cached" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Packages
        shell: pwsh
        run: |
          cargo build --release --locked -p rvp-shell
          cargo xtask look look
          $runtime = Join-Path $env:RUNNER_TEMP 'msvc-runtime'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          # vcomp140: Microsoft's OpenMP runtime, which RIFE's plugin needs.
          foreach ($dll in 'concrt140', 'msvcp140', 'msvcp140_1', 'msvcp140_2', 'vcruntime140', 'vcruntime140_1', 'vcomp140') {
            Copy-Item "$env:SystemRoot\System32\$dll.dll" $runtime
          }
          # M18: RVP's own VapourSynth runtime (MVTools, RIFE).
          $vapoursynth = Join-Path $env:RUNNER_TEMP 'vapoursynth'
          python tools/packaging/vapoursynth.py --out $vapoursynth --vcomp "$runtime\vcomp140.dll" `
            --cache (Join-Path $env:RUNNER_TEMP 'vapoursynth-cache') --sevenzip 7z
          python tools/packaging/package.py windows --exe target/release/rvp.exe --qt $env:QT_ROOT_DIR `
            --mpv "$env:MPV_LIB_DIR\libmpv-2.dll" --runtime $runtime --vapoursynth $vapoursynth --look look --out packages `
            --makensis $env:MAKENSIS --objdump 'C:\Program Files\LLVM\bin\llvm-objdump.exe'
      - name: Windows' media controls
        shell: powershell
        run: |
          # The hosted runner works in a desktop session, which Windows'
          # media session manager needs (the test VM's SSH sessions lack it).
          $base = Join-Path $env:RUNNER_TEMP 'm8-smtc'
          Expand-Archive -Path (Get-ChildItem packages\*-portable.zip).FullName -DestinationPath $base
          Copy-Item testdata\media\fixture-60s.mkv, tools\windows-vm\m8-smtc.ps1 $base
          $env:QT_OPENGL = 'software'
          & "$base\m8-smtc.ps1"
      - uses: actions/upload-artifact@v4
        with:
          name: rvp-windows
          path: |
            packages/*.zip
            packages/*-setup.exe
          retention-days: 14

  # Only the newest packages stay (the owner, 2026-10-19: the account's
  # artifact storage filled up): once both of this run's are uploaded, the
  # artifacts of earlier runs go. Later runs' are kept, since run IDs grow
  # and two runs can overlap.
  prune-artifacts:
    if: github.event_name != 'pull_request'
    needs: [package-linux, package-windows]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete earlier runs' artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id < $GITHUB_RUN_ID) | \"\(.id) \(.name) \(.size_in_bytes)\"" |
          while read -r id name size; do
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > /dev/null; then
              echo "deleted $name ($size bytes, artifact $id)"
            else
              echo "::warning::artifact $id ($name) was not deleted"
            fi
          done
