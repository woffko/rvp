[workspace]
resolver = "3"
members = ["crates/skin", "crates/look", "crates/engine", "crates/app", "crates/platform", "shell", "xtask"]
# Throwaway goal B spikes (their own workspace with relaxed lints) and the
# patched libmpv2 (used through [patch.crates-io] below).
exclude = ["spikes", "vendor"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/woffko/rvp"
publish = false

[workspace.dependencies]
# Exact versions: dependency updates are deliberate, reviewed changes.
# The Qt shell (D3); the versions S3 verified.
cxx = "=1.0.204"
cxx-qt = "=0.10.0"
cxx-qt-build = { version = "=0.10.0", features = ["link_qt_object_files"] }
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml"] }
# libmpv binding (D1); LGPL-2.1, waived in D8. Patched, see [patch.crates-io].
libmpv2 = { version = "=6.0.0", default-features = false, features = ["render"] }
png = "=0.18.1"
# Settings and the resume store are JSON files (D9).
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
swash = "=0.2.10"
# Fills and strokes the paths of RVP's own vector art (crates/look); already
# in the tree as swash's glyph rasterizer.
zeno = "=0.3.3"
zip = { version = "=9.0.0", default-features = false, features = ["deflate-flate2"] }

[patch.crates-io]
# One fix in the event conversion; see vendor/libmpv2/RVP-PATCH.md.
libmpv2 = { path = "vendor/libmpv2" }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.dev.package."*"]
# Image decoding in tests is slow without optimizations.
opt-level = 2

[profile.dev.package.rvp-skin]
# Rendering and image comparison in tests.
opt-level = 2
