[workspace]
resolver = "3"
members = ["crates/skin", "crates/look", "crates/engine", "crates/app", "crates/platform", "crates/subtitle", "shell", "xtask"]
# Throwaway goal B spikes (their own workspace with relaxed lints) and the
# patched libmpv2 (used through [patch.crates-io] below).
exclude = ["spikes", "vendor"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/woffko/rvp"
publish = false

[workspace.dependencies]
# Exact versions: dependency updates are deliberate, reviewed changes.
# The Qt shell (D3); the versions S3 verified.
cxx = "=1.0.204"
cxx-qt = "=0.10.0"
cxx-qt-build = { version = "=0.10.0", features = ["link_qt_object_files"] }
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml"] }
# libmpv binding (D1); LGPL-2.1, waived in D8. Patched, see [patch.crates-io].
libmpv2 = { version = "=6.0.0", default-features = false, features = ["render"] }
# VLC's .vlt skins are gzip'd tar archives (M9); zip already brings it.
flate2 = { version = "=1.1.10", default-features = false }
png = "=0.18.1"
# Settings and the resume store are JSON files (D9).
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
swash = "=0.2.10"
# Fills and strokes the paths of RVP's own vector art (crates/look); already
# in the tree as swash's glyph rasterizer.
zeno = "=0.3.3"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }
# The legacy code pages of subtitle files (CP949, Shift_JIS, GBK, Big5,
# Windows-125x) for RVP's subtitle reader (M13, crates/subtitle); MIT or
# Apache-2.0, with BSD-3-Clause for the WHATWG index data.
encoding_rs = "=0.8.35"
# The control API's per-installation token (M15, D15): the system's random
# bytes, which std does not offer; already in the tree through tempfile and
# jobserver; MIT or Apache-2.0.
getrandom = "=0.4.3"
# D-Bus for MPRIS, idle inhibit, the launcher's progress and the screen lock
# on Linux (M8, M17, crates/platform): pure Rust, so the packages need no
# libdbus; MIT. zbus 6 (goal S) merged zvariant and zbus_names, whose 5.x
# crates were flagged unmaintained, and runs its connections on its own
# small runtime (zruntime), driven by a helper thread when no thread waits
# in `zbus::block_on`. Only the runtime, proxies and served interfaces.
zbus = { version = "=6.2.0", default-features = false, features = ["default-rt", "proxy", "service"] }
# Polls zbus's message streams (the screen lock's signals) without
# futures-util; already in the tree through zbus; MIT or Apache-2.0.
futures-core = { version = "=0.3.34", default-features = false }
# zbus 6's runtime, for its async channel: the desktop thread waits on its
# messages and serves D-Bus at once (crates/platform); already in the tree
# through zbus; MIT.
zruntime = { version = "=0.2.2", default-features = false, features = ["mpmc"] }
# Checks NVIDIA's TensorRT and CUDA archives that RIFE (TensorRT) downloads
# on the user's request against their pinned SHA-256 (M18,
# docs/spikes/m18-tensorrt.md): 2.2 GB of native libraries that RVP loads;
# also the control API's HMAC-SHA-256 of signed requests (written on it,
# crates/app/src/control/sign.rs); RustCrypto's pure Rust implementation;
# MIT or Apache-2.0.
sha2 = "=0.11.1"
# Fatal signal handlers for the crash log on Linux (M8, shell/src/crash.rs);
# already in the tree.
libc = "=0.2.190"
# Microsoft's bindings for Windows' media controls and the crash minidump
# (M8, shell/src/media_controls.rs and crash.rs), and the rest of the
# shell's Windows calls (the control API's token's access rules among
# them); MIT or Apache-2.0.
# The COM objects RVP implements (windows' `implement` macro names it).
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Foundation",
    "Media",
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_Media_DirectShow",
    "Win32_UI_Shell",
] }

[patch.crates-io]
# RVP's fixes and wrappers, each listed in vendor/libmpv2/RVP-PATCH.md.
libmpv2 = { path = "vendor/libmpv2" }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.dev.package."*"]
# Image decoding in tests is slow without optimizations.
opt-level = 2

[profile.dev.package.rvp-skin]
# Rendering and image comparison in tests.
opt-level = 2
