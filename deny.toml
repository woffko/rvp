# cargo-deny configuration. Run with `cargo deny check` or `cargo xtask ci`.

[graph]
all-features = false
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Any advisory fails the build. None is ignored: zbus 5's zvariant,
# zbus_names and zvariant_derive (RUSTSEC-2026-0370 to 0372, unmaintained
# since zbus 6 took them in) left the tree with the move to zbus 6 (goal S).
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# The workspace crates are GPL-3.0-or-later and not published; only
# third-party licenses are checked.
private = { ignore = true }
# Only licenses present in the dependency graph, so a new license is a
# deliberate, reviewed change. All are permissive and OSI-approved.
allow = [
    "0BSD",
    "Apache-2.0",
    # encoding_rs's WHATWG index data (M13's subtitle reader).
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The libmpv binding crates are LGPL-2.1 (D1 and D8 in docs/PLAN.md: the
# no-GPL/LGPL rule is waived for libmpv; owner decision 2026-10-10).
exceptions = [
    { allow = ["LGPL-2.1"], crate = "libmpv2" },
    { allow = ["LGPL-2.1"], crate = "libmpv2-sys" },
]

[bans]
# png and zip pull two miniz_oxide versions through flate2; harmless.
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path; none is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
