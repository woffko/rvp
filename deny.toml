# cargo-deny configuration. Run with `cargo deny check` or `cargo xtask ci`.

[graph]
all-features = false
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Any advisory fails the build, except these, each with its reason:
ignore = [
    # zbus 5's parts (MPRIS and idle inhibit on Linux, crates/platform) are
    # "unmaintained" since zbus 6 took them in (2026-10). zbus 6 drops the
    # blocking API RVP uses and brings tokio; the move is goal S's (the
    # Linux goal), listed in docs/goals/goal-m-status.md. Not a
    # vulnerability: no fix exists for 5.x.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; the move is goal S's" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; the move is goal S's" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; the move is goal S's" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The workspace crates are GPL-3.0-or-later and not published; only
# third-party licenses are checked.
private = { ignore = true }
# Only licenses present in the dependency graph, so a new license is a
# deliberate, reviewed change. All are permissive and OSI-approved.
allow = [
    "0BSD",
    "Apache-2.0",
    # encoding_rs's WHATWG index data (M13's subtitle reader).
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The libmpv binding crates are LGPL-2.1 (D1 and D8 in docs/PLAN.md: the
# no-GPL/LGPL rule is waived for libmpv; owner decision 2026-10-10).
exceptions = [
    { allow = ["LGPL-2.1"], crate = "libmpv2" },
    { allow = ["LGPL-2.1"], crate = "libmpv2-sys" },
]

[bans]
# png and zip pull two miniz_oxide versions through flate2; harmless.
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path; none is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
